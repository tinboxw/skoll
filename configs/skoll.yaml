# Skoll runtime configuration
# Precedence: SKOLL_* environment variables > this file > built-in defaults.

server:
  # Address format: ":8080" or "127.0.0.1:8080"
  address: ":8080"
  shutdown_timeout: "10s"

store:
  # memory | mysql | postgres
  mode: "memory"
  dsn: ""

event:
  # memory | redis
  mode: "memory"
  redis_addr: ""
  channel_prefix: "skoll.events"

security:
  # Change this in non-local environments.
  jwt_secret: "dev-secret-change-me"

log:
  # debug | info | warn | error
  level: "info"
