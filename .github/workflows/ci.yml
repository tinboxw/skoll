name: CI Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend workspace
        id: frontend
        shell: bash
        run: |
          if [ -f web/package.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
            echo "web/package.json not found; frontend typecheck is skipped."
          fi

      - name: Setup Node
        if: steps.frontend.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        run: npm ci

      - name: Run frontend typecheck
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        run: npm run typecheck

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend workspace
        id: frontend
        shell: bash
        run: |
          if [ -f web/package.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
            echo "web/package.json not found; frontend build is skipped."
          fi

      - name: Setup Node
        if: steps.frontend.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        run: npm ci

      - name: Run frontend build
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        run: npm run build

      - name: Enforce frontend bundle budgets
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        run: npm run check:bundle

      - name: Upload frontend bundle report
        if: steps.frontend.outputs.has_frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-budget
          path: web/test-results/pr4-quality/bundle.json
          if-no-files-found: error

  frontend-visual-performance:
    name: Frontend Visual And Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Start acceptance services
        shell: bash
        env:
          SKOLL_STORE_MODE: memory
          SKOLL_CACHE_MODE: memory
          SKOLL_EVENT_MODE: memory
          SKOLL_DEV_ADMIN_PASSWORD: Admin@123456
        run: |
          mkdir -p artifacts
          go run ./cmd/skoll > artifacts/frontend-backend.log 2>&1 &
          (cd web && npm run preview -- --host 127.0.0.1 --port 5174 > ../artifacts/frontend-preview.log 2>&1) &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5174/skoll/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat artifacts/frontend-backend.log
          cat artifacts/frontend-preview.log
          exit 1

      - name: Run visual regression gate
        working-directory: web
        env:
          SKOLL_E2E_BROWSER_CHANNEL: chromium
        run: npm run test:visual

      - name: Run runtime performance gate
        working-directory: web
        env:
          SKOLL_E2E_BROWSER_CHANNEL: chromium
        run: npm run test:performance

      - name: Upload frontend quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-visual-performance
          path: |
            web/test-results/pr4-quality
            artifacts/frontend-backend.log
            artifacts/frontend-preview.log
          if-no-files-found: warn

  frontend-browser-smoke:
    name: Frontend Browser Smoke Minimum
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect frontend workspace
        id: frontend
        shell: bash
        run: |
          if [ -f web/package.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
            echo "web/package.json not found; frontend browser smoke is skipped."
          fi

      - name: Setup Node
        if: steps.frontend.outputs.has_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        run: npm ci

      - name: Build frontend for smoke
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        run: npm run build

      - name: Run minimum browser smoke
        if: steps.frontend.outputs.has_frontend == 'true'
        working-directory: web
        shell: bash
        run: |
          mkdir -p ../artifacts
          node scripts/fe5-browser-smoke-minimum.mjs --json | tee ../artifacts/frontend-browser-smoke.json

      - name: Upload browser smoke artifact
        if: steps.frontend.outputs.has_frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-smoke-minimum
          path: artifacts/frontend-browser-smoke.json
          if-no-files-found: error

  quality-gates:
    name: Go Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Detect module
        id: module
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "has_module=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_module=false" >> "$GITHUB_OUTPUT"
            echo "go.mod not found; quality checks are skipped for scaffold stage."
          fi

      - name: Check format (gofmt)
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        run: |
          files=$(find . -type f -name "*.go" -not -path "./vendor/*")
          if [ -z "$files" ]; then
            echo "No Go files found; skip gofmt check."
            exit 0
          fi

          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Enforce no-fallback baseline
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        run: bash scripts/ci/check-no-fallback.sh

      - name: Run unit tests
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        run: go test ./...

      - name: Run coverage tests
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        run: |
          mkdir -p artifacts
          go test ./... -covermode=atomic -coverprofile=artifacts/coverage.out
          go tool cover -func=artifacts/coverage.out | tee artifacts/coverage.txt

      - name: Upload coverage artifact
        if: steps.module.outputs.has_module == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            artifacts/coverage.out
            artifacts/coverage.txt
          if-no-files-found: error

      - name: Validate OpenAPI contract
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        run: go test ./internal/handler/http -run TestOpenAPIContractFilesStayInSync -count=1

      - name: Validate plugin manifests
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        env:
          SKOLL_CORE_VERSION: "1.0.0"
        run: go test ./internal/plugin -run TestValidatePluginManifestsUnderPluginsDir -count=1

      - name: Detect concurrency-related changes
        id: detect_race
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          if [ -z "$base_sha" ]; then
            echo "run_race=false" >> "$GITHUB_OUTPUT"
            echo "Cannot resolve base SHA; skip race test."
            exit 0
          fi

          changed_go=$(git diff --name-only "$base_sha" "${{ github.sha }}" -- '*.go' || true)
          if [ -z "$changed_go" ]; then
            echo "run_race=false" >> "$GITHUB_OUTPUT"
            echo "No Go file changes detected."
            exit 0
          fi

          patterns='go[[:space:]]+func|chan|sync\\.|atomic\\.|WaitGroup|Mutex|RWMutex|Once|context\\.With(Cancel|Timeout|Deadline)'
          run_race=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if grep -En "$patterns" "$f" >/dev/null 2>&1; then
              run_race=true
              echo "Concurrency-related change detected in $f"
              break
            fi
          done <<< "$changed_go"

          echo "run_race=$run_race" >> "$GITHUB_OUTPUT"

      - name: Run race tests
        if: steps.module.outputs.has_module == 'true' && steps.detect_race.outputs.run_race == 'true'
        shell: bash
        run: go test -race ./...

      - name: Capture benchmark snapshot
        if: steps.module.outputs.has_module == 'true'
        shell: bash
        run: |
          mkdir -p artifacts
          go test -bench=. -benchmem ./... | tee artifacts/bench.txt

      - name: Upload benchmark artifact
        if: steps.module.outputs.has_module == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-snapshot
          path: artifacts/bench.txt
          if-no-files-found: warn
