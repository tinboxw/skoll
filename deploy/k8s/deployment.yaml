apiVersion: apps/v1
kind: Deployment
metadata:
  name: skoll
  labels:
    app.kubernetes.io/name: skoll
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skoll
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skoll
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: skoll
          image: skoll:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: skoll-runtime
            - secretRef:
                name: skoll-runtime
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: plugins
              mountPath: /app/plugins
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsUser: 10001
            runAsGroup: 10001
          startupProbe:
            httpGet:
              path: /skoll/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /skoll/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /skoll/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skoll-data
        - name: plugins
          persistentVolumeClaim:
            claimName: skoll-plugins
