      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Read confirmation list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnnouncementReceiptListAPIResponse'}
        '404':
          description: Announcement not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
components:
  schemas:
    AnnouncementAudience:
      type: object
      required: [organizationIds, roleIds]
      properties:
        organizationIds: {type: array, items: {type: string}}
        roleIds: {type: array, items: {type: string}}
    AnnouncementDocument:
      type: object
      required: [fileId, fileName]
      properties:
        fileId: {type: string}
        fileName: {type: string}
    AnnouncementCreateRequest:
      type: object
      required: [kind, title, content, audience, documents]
      properties:
        kind: {type: string, enum: [announcement, policy]}
        title: {type: string, minLength: 1, maxLength: 160}
        content: {type: string, minLength: 1, maxLength: 5000}
        audience: {$ref: '#/components/schemas/AnnouncementAudience'}
        documents:
          type: array
          items: {$ref: '#/components/schemas/AnnouncementDocument'}
        actorId: {type: string}
    Announcement:
      type: object
      required: [id, kind, title, content, audience, documents, status, createdBy, createdAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [announcement, policy]}
        title: {type: string}
        content: {type: string}
        audience: {$ref: '#/components/schemas/AnnouncementAudience'}
        documents:
          type: array
          items: {$ref: '#/components/schemas/AnnouncementDocument'}
        status: {type: string, enum: [draft, published]}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        publishedBy: {type: string}
        publishedAt: {type: string, format: date-time}
    AnnouncementReadConfirmation:
      type: object
      required: [announcementId, userId, readAt]
      properties:
        announcementId: {type: string}
        userId: {type: string}
        readAt: {type: string, format: date-time}
    AnnouncementItemData:
      type: object
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/Announcement'}
    AnnouncementListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Announcement'}
    AnnouncementReceiptItemData:
      type: object
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/AnnouncementReadConfirmation'}
    AnnouncementReceiptListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AnnouncementReadConfirmation'}
    AnnouncementItemAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AnnouncementItemData'}
    AnnouncementListAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AnnouncementListData'}
    AnnouncementReceiptItemAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AnnouncementReceiptItemData'}
    AnnouncementReceiptListAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AnnouncementReceiptListData'}
    InventoryAlertPolicyRequest:
      type: object
      required: [nearExpiryDays, lowStockThreshold, overStockThreshold, recipientId]
      properties:
        nearExpiryDays: {type: integer, minimum: 1}
        lowStockThreshold: {type: integer, minimum: 0}
        overStockThreshold: {type: integer, minimum: 1}
        recipientId: {type: string}
    InventoryAlert:
      type: object
