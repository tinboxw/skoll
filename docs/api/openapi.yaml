components:
  schemas:
    MessageResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    AuditActorRef:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
    AuditResourceRef:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
    AuditTraceContext:
      type: object
      properties:
        traceId:
          type: string
        requestId:
          type: string
        method:
          type: string
        path:
          type: string
        ip:
          type: string
        userAgent:
          type: string
    AuditEvent:
      type: object
      required:
        - id
        - type
        - action
        - actor
        - resource
        - result
        - risk
        - occurredAt
      properties:
        id:
          type: string
        type:
          type: string
          enum: [operation, login, error, plugin, security]
        action:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}$'
        actor:
          $ref: '#/components/schemas/AuditActorRef'
        resource:
          $ref: '#/components/schemas/AuditResourceRef'
        result:
          type: string
          enum: [success, failure, denied]
        risk:
          type: string
          enum: [low, medium, high, critical]
        trace:
          $ref: '#/components/schemas/AuditTraceContext'
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    AuditEventListData:
      type: object
      required:
        - items
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Optional total count when the backing store can compute it efficiently.
    AuditEventListAPIResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/AuditEventListData'
    AuditEventDiff:
      type: object
      properties:
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        summary:
          type: array
          items:
            type: string
    AuditEventDetail:
      allOf:
        - $ref: '#/components/schemas/AuditEvent'
        - type: object
          properties:
            sourceData:
              type: object
              additionalProperties: true
              description: Raw source log payload, such as login_log or error_log fields.
            diff:
              $ref: '#/components/schemas/AuditEventDiff'
    AuditEventDetailData:
      type: object
      required:
        - item
      properties:
        item:
          $ref: '#/components/schemas/AuditEventDetail'
    AuditEventDetailAPIResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/AuditEventDetailData'
    PermissionResource:
      type: object
      required:
        - key
        - type
        - module
        - source
        - name
        - risk
        - enabled
      properties:
        key:
          type: string
        type:
          type: string
          enum: [api, menu, button, data_scope, plugin]
        module:
          type: string
        source:
          type: string
        name:
          type: string
        risk:
          type: string
          enum: [low, medium, high, critical]
        metadata:
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
    PermissionResourceInput:
      type: object
      required:
        - key
        - type
        - module
        - source
        - name
      properties:
        key:
          type: string
        type:
          type: string
          enum: [api, menu, button, data_scope, plugin]
        module:
          type: string
        source:
          type: string
        name:
          type: string
        risk:
          type: string
          enum: [low, medium, high, critical]
          default: low
        metadata:
          type: object
          additionalProperties:
            type: string
    PermissionResourceListData:
      type: object
      required:
        - items
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResource'
        offset:
          type: integer
        limit:
          type: integer
    PermissionResourceDetailData:
      type: object
      required:
        - item
      properties:
        item:
          $ref: '#/components/schemas/PermissionResource'
    PermissionStateChangeData:
      type: object
      required:
        - key
        - enabled
      properties:
        key:
          type: string
        enabled:
          type: boolean
    PermissionResourceDiffRequest:
      type: object
      required:
        - source
        - desired
      properties:
        source:
          type: string
        desired:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResourceInput'
    PermissionResourceDiffResult:
      type: object
      required:
        - added
        - updated
        - removed
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResource'
        updated:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResource'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/PermissionResource'
    PermissionResourceListAPIResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/PermissionResourceListData'
    PermissionResourceDetailAPIResponse:
