openapi: 3.0.3
info:
  title: Skoll API
  version: 1.0.0
  description: OpenAPI document for Skoll core HTTP endpoints.
servers:
  - url: __API_BASE_PREFIX__
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/auth/login:
    post:
      summary: Login with account and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account
                - password
              properties:
                account:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /v1/auth/logout:
    post:
      summary: Logout current user
      responses:
        '200':
          description: OK
  /v1/auth/me:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
  /v1/auth/me/profile:
    put:
      summary: Update current user profile
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
  /v1/auth/me/password:
    patch:
      summary: Update current user password
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /v1/users:
    get:
      summary: List users
      responses:
        '200':
          description: OK
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account
                - email
                - passwordHash
              properties:
                account:
                  type: string
                name:
                  type: string
                email:
                  type: string
                passwordHash:
                  type: string
                departmentId:
                  type: string
                positionId:
                  type: string
      responses:
        '201':
          description: Created
  /v1/users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    put:
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                status:
                  type: string
                  enum: [active, disabled]
                departmentId:
                  type: string
                positionId:
                  type: string
      responses:
        '200':
          description: OK
    delete:
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/users/{id}/roles:
    post:
      summary: Assign role to user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/roles:
    get:
      summary: List roles
      responses:
        '200':
          description: OK
    post:
      summary: Create role
      responses:
        '201':
          description: Created
  /v1/roles/{id}/users:
    get:
      summary: List users by role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /v1/rbac/check:
    post:
      summary: Check authorization
      responses:
        '200':
          description: Permission decision with resolved data scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  scope:
                    type: string
                    enum: [self, dept, dept_tree, custom, all]
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /v1/rbac/bindings:
    get:
      summary: List role bindings by subject
      parameters:
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/rbac/bindings/{id}:
    delete:
      summary: Delete a role binding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/audit:
    get:
      summary: List audit events
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [operation, login, error, plugin, security]
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}$'
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure, denied]
        - name: risk
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Audit event list wrapped in the standard response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListAPIResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
    delete:
      summary: Clear audit records by time range
      responses:
        '200':
          description: OK
  /v1/audit/{id}:
    get:
      summary: Get audit event detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit event detail wrapped in the standard response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventDetailAPIResponse'
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /v1/audit/export:
    get:
      summary: Export audit event source data as CSV
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [operation, login, error, plugin, security]
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}$'
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure, denied]
        - name: risk
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: CSV with fixed columns eventId and sourceData
          content:
            text/csv:
              schema:
                type: string
                description: CSV header is `eventId,sourceData`; sourceData is compact JSON encoded as a CSV field.
              examples:
                auditEventSourceData:
                  value: |
                    eventId,sourceData
                    event-1,"{""ip"":""127.0.0.1"",""result"":""denied""}"
        '400':
          description: Bad Request
  /v1/audit/actors/{actorId}:
    get:
      summary: List audit records by actor
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/plugins:
    get:
      summary: List plugins
      responses:
        '200':
          description: OK
  /v1/plugins/marketplace/local:
    get:
      summary: List local plugin marketplace entries
      parameters:
        - name: pluginsRoot
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalMarketplaceAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/preflight:
    post:
      summary: Run plugin install preflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginPathRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallPreflightAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/{id}:
    get:
      summary: Get plugin detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /v1/plugins/{id}/config:
    get:
      summary: Get plugin config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      summary: Update plugin config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/plugins/dev/rollout:
    post:
      summary: Execute plugin rollout with task tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/rollback:
    post:
      summary: Execute plugin rollback with task tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/rollout-tasks:
    get:
      summary: List rollout tasks
      parameters:
        - name: pluginId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutTaskListAPIResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/rollout-tasks/{taskId}:
    get:
      summary: Get rollout task detail
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutTaskGetAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/dev/rollout-tasks/{taskId}/logs:
    get:
      summary: Get rollout task logs
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutTaskLogsAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/dev/release-orders:
    post:
      summary: Create plugin release order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOrderCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOrderCreateAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    get:
      summary: List plugin release orders
      parameters:
        - name: pluginsRoot
          in: query
          required: true
          schema:
            type: string
        - name: pluginId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOrderListAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/release-orders/{orderId}/approve:
    post:
      summary: Approve plugin release order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOrderReviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOrderReviewAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/release-orders/{orderId}/reject:
    post:
      summary: Reject plugin release order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOrderReviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOrderReviewAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/release-orders/{orderId}/execute:
    post:
      summary: Execute approved plugin release order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOrderExecuteRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOrderExecuteAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/release-tasks:
    get:
      summary: List plugin release tasks
      parameters:
        - name: pluginsRoot
          in: query
          required: true
          schema:
            type: string
        - name: pluginId
          in: query
          required: false
          schema:
            type: string
        - name: orderId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseTaskListAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/release-tasks/{taskId}:
    get:
      summary: Get plugin release task detail
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: pluginsRoot
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseTaskGetAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/dev/release-tasks/{taskId}/logs:
    get:
      summary: Get plugin release task logs
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: pluginsRoot
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseTaskLogsAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/system/settings:
    get:
      summary: List system settings
      responses:
        '200':
          description: OK
  /v1/system/settings/schema:
    get:
      summary: Get system settings schema
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/SystemSettingSchema'
  /v1/system/settings/{key}:
    get:
      summary: Get system setting by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      summary: Upsert system setting by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/system/settings/reset:
    post:
      summary: Reset system settings
      responses:
        '200':
          description: OK
  /v1/system/dictionaries:
    get:
      summary: List system dictionaries
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [enabled, disabled]
        - name: search
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Bulk upsert system dictionaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: OK
  /v1/system/dictionaries/{type}:
    get:
      summary: Get system dictionary by type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      summary: Upsert system dictionary type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
    delete:
      summary: Delete system dictionary type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /v1/system/dictionaries/{type}/items:
    get:
      summary: List system dictionary items
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [enabled, disabled]
        - name: search
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
  /v1/system/dictionaries/{type}/items/{value}:
    put:
      summary: Upsert system dictionary item
      parameters:
        - name: type
          in: path
          required: true
