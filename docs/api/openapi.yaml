openapi: 3.0.3
info:
  title: Skoll API
  version: 1.0.0
  description: OpenAPI document for Skoll core HTTP endpoints.
servers:
  - url: __API_BASE_PREFIX__
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/auth/login:
    post:
      summary: Login with account and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account
                - password
              properties:
                account:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /v1/auth/logout:
    post:
      summary: Logout current user
      responses:
        '200':
          description: OK
  /v1/auth/me:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
  /v1/auth/me/profile:
    put:
      summary: Update current user profile
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
  /v1/auth/me/password:
    patch:
      summary: Update current user password
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /v1/pharma-oa/employees:
    get:
      summary: List Pharma OA employees
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, on_leave, left]
      responses:
        '200':
          description: OK
    post:
      summary: Create Pharma OA employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, departmentId, positionId]
              properties:
                code:
                  type: string
                name:
                  type: string
                departmentId:
                  type: string
                positionId:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                certificates:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Created
  /v1/pharma-oa/employees/{id}:
    put:
      summary: Update Pharma OA employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/employees/{id}/leave:
    post:
      summary: Mark Pharma OA employee left
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/employees/qualification-reminders:
    get:
      summary: List Pharma OA employee qualification reminders
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: OK
  /v1/pharma-oa/products:
    get:
      summary: List Pharma OA products
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
      responses:
        '200':
          description: OK
    post:
      summary: Create Pharma OA product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, spec, dosageForm, manufacturer, approvalNumber]
              properties:
                code:
                  type: string
                name:
                  type: string
                spec:
                  type: string
                dosageForm:
                  type: string
                manufacturer:
                  type: string
                approvalNumber:
                  type: string
                temperature:
                  type: object
                  properties:
                    required:
                      type: boolean
                    minCelsius:
                      type: number
                    maxCelsius:
                      type: number
      responses:
        '201':
          description: Created
  /v1/pharma-oa/products/{id}:
    put:
      summary: Update Pharma OA product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/products/{id}/disable:
    post:
      summary: Disable Pharma OA product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/products/import:
    post:
      summary: Import Pharma OA products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: OK
  /v1/pharma-oa/suppliers:
    get:
      summary: List Pharma OA suppliers
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
      responses:
        '200':
          description: OK
    post:
      summary: Create Pharma OA supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                name:
                  type: string
                rating:
                  type: integer
                  minimum: 0
                  maximum: 5
                contacts:
                  type: array
                  items:
                    type: object
                qualifications:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Created
  /v1/pharma-oa/suppliers/{id}:
    put:
      summary: Update Pharma OA supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/suppliers/{id}/disable:
    post:
      summary: Disable Pharma OA supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/suppliers/{id}/purchase-eligibility:
    get:
      summary: Validate Pharma OA supplier purchase eligibility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/suppliers/qualification-reminders:
    get:
      summary: List Pharma OA supplier qualification reminders
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: OK
  /v1/pharma-oa/customers:
    get:
      summary: List Pharma OA customers
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
        - name: region
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: string
        - name: organizationId
          in: query
          schema:
            type: string
        - name: includeAll
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
    post:
      summary: Create Pharma OA customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, region, organizationId, ownerId]
              properties:
                code:
                  type: string
                name:
                  type: string
                region:
                  type: string
                organizationId:
                  type: string
                ownerId:
                  type: string
                rating:
                  type: integer
                  minimum: 0
                  maximum: 5
                contacts:
                  type: array
                  items:
                    type: object
                qualifications:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Created
  /v1/pharma-oa/customers/{id}:
    put:
      summary: Update Pharma OA customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/customers/{id}/disable:
    post:
      summary: Disable Pharma OA customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/customers/{id}/sales-eligibility:
    get:
      summary: Validate Pharma OA customer sales eligibility
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: string
        - name: organizationId
          in: query
          schema:
            type: string
        - name: includeAll
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
  /v1/pharma-oa/customers/qualification-reminders:
    get:
      summary: List Pharma OA customer qualification reminders
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: ownerId
          in: query
          schema:
            type: string
        - name: organizationId
          in: query
          schema:
            type: string
        - name: includeAll
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
  /v1/pharma-oa/warehouses:
    get:
      summary: List Pharma OA warehouses
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [enabled, disabled]
        - name: region
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      summary: Create Pharma OA warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, region, areas]
              properties:
                code:
                  type: string
                name:
                  type: string
                region:
                  type: string
                temperature:
                  type: object
                areas:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Created
  /v1/pharma-oa/warehouses/{id}:
    put:
      summary: Update Pharma OA warehouse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/warehouses/{id}/disable:
    post:
      summary: Disable Pharma OA warehouse
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/warehouses/{id}/movement-eligibility:
    get:
      summary: Validate Pharma OA warehouse movement location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: areaId
          in: query
          required: true
          schema:
            type: string
        - name: locationId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/master-data/template:
    get:
      summary: Get Pharma OA master data import template
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
            enum: [employees, products, suppliers, customers]
      responses:
        '200':
          description: OK
  /v1/pharma-oa/master-data/import:
    post:
      summary: Import Pharma OA master data rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, rows]
              properties:
                resource:
                  type: string
                  enum: [employees, products, suppliers, customers]
                rows:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: string
      responses:
        '200':
          description: OK
  /v1/pharma-oa/master-data/export:
    get:
      summary: Export Pharma OA master data rows
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
            enum: [employees, products, suppliers, customers]
      responses:
        '200':
          description: OK
  /v1/pharma-oa/purchase-requests:
    get:
      summary: List Pharma OA purchase requests
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestListResponse'
    post:
      summary: Create a Pharma OA purchase request and start approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequestCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '400':
          description: Invalid request or supplier is not purchase eligible
  /v1/pharma-oa/purchase-requests/{id}:
    get:
      summary: Get a Pharma OA purchase request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '404':
          description: Purchase request not found
  /v1/pharma-oa/purchase-requests/{id}/approve:
    post:
      summary: Approve a purchase request and generate its purchase order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseApprovalRequest'
      responses:
        '200':
          description: Approved purchase order; repeated approval returns the same order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Approval failed or supplier is not purchase eligible
  /v1/pharma-oa/purchase-requests/{id}/reject:
    post:
      summary: Reject a purchase request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseApprovalRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
  /v1/pharma-oa/purchase-orders:
    get:
      summary: List Pharma OA purchase orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderListResponse'
  /v1/pharma-oa/purchase-orders/{id}:
    get:
      summary: Get a Pharma OA purchase order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '404':
          description: Purchase order not found
  /v1/pharma-oa/purchase-inbounds:
    get:
      summary: List Pharma OA purchase inbounds
      responses:
        '200': {description: OK}
    post:
      summary: Complete purchase inbound and increase batch inventory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseInboundCreateRequest'}
      responses:
        '201': {description: Created}
        '400': {description: Invalid order, location, batch, expiry, attachment, or quantity}
  /v1/pharma-oa/purchase-inbounds/{id}:
    get:
      summary: Get Pharma OA purchase inbound
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
        '404': {description: Purchase inbound not found}
  /v1/pharma-oa/sales-orders:
    get:
      summary: List Pharma OA sales orders
      responses:
        '200': {description: OK}
    post:
      summary: Create a sales order after customer qualification validation
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SalesOrderCreateRequest'}
      responses:
        '201': {description: Created}
        '400': {description: Invalid order or ineligible customer}
  /v1/pharma-oa/sales-orders/{id}:
    get:
      summary: Get Pharma OA sales order
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
        '404': {description: Sales order not found}
  /v1/pharma-oa/sales-outbounds:
    get:
      summary: List Pharma OA sales outbounds
      responses:
        '200': {description: OK}
    post:
      summary: Complete sales outbound and decrease batch inventory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SalesOutboundCreateRequest'}
      responses:
        '201': {description: Created}
        '400': {description: Expired customer qualification, invalid location, order mismatch, or insufficient stock}
  /v1/pharma-oa/sales-outbounds/{id}:
    get:
      summary: Get Pharma OA sales outbound
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: OK}
        '404': {description: Sales outbound not found}
  /v1/pharma-oa/stocktakes:
    get:
      summary: List Pharma OA stocktake orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StocktakeOrderListResponse'}
    post:
      summary: Create a stocktake difference pending workflow approval
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StocktakeCreateRequest'}
      responses:
        '201':
          description: Stocktake difference created and pending approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StocktakeOrderResponse'}
        '400': {description: Invalid stock position, quantity, or approver}
  /v1/pharma-oa/stocktakes/{id}:
    get:
      summary: Get a Pharma OA stocktake order
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StocktakeOrderResponse'}
        '404': {description: Stocktake order not found}
  /v1/pharma-oa/stocktakes/{id}/approve:
    post:
      summary: Approve a stocktake difference and post its inventory ledger entry
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryApprovalRequest'}
      responses:
        '200':
          description: Approved; repeated approval returns the same ledger reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StocktakeOrderResponse'}
        '400': {description: Approval failed or inventory changed after the count}
  /v1/pharma-oa/stocktakes/{id}/reject:
    post:
      summary: Reject a stocktake difference without changing inventory
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryApprovalRequest'}
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StocktakeOrderResponse'}
        '400': {description: Rejection failed}
  /v1/pharma-oa/transfers:
    get:
      summary: List Pharma OA stock transfer orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferOrderListResponse'}
    post:
      summary: Transfer batch inventory and create paired outbound and inbound ledger entries
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferCreateRequest'}
      responses:
        '201':
          description: Transfer completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferOrderResponse'}
        '400': {description: Invalid locations, quantity, batch, or insufficient stock}
  /v1/pharma-oa/transfers/{id}:
    get:
      summary: Get a Pharma OA stock transfer order
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransferOrderResponse'}
        '404': {description: Transfer order not found}
  /v1/pharma-oa/inventory-alerts:
    get:
      summary: List Pharma OA inventory alerts
      parameters:
        - {name: activeOnly, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryAlertListResponse'}
        '400': {description: Invalid activeOnly filter}
  /v1/pharma-oa/inventory-alert-jobs:
    get:
      summary: List Pharma OA inventory alert scan jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryAlertJobListResponse'}
    post:
      summary: Run a near-expiry, low-stock, and over-stock alert scan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryAlertPolicyRequest'}
      responses:
        '201':
          description: Scan completed and actionable reminders emitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryAlertJobResponse'}
        '400': {description: Invalid thresholds, recipient, or scan failure}
  /v1/pharma-oa/inventory-alert-jobs/{id}/retry:
    post:
      summary: Retry a failed Pharma OA inventory alert scan job
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Retry completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryAlertJobResponse'}
        '400': {description: Job not found, not failed, or retry failed}
  /v1/users:
    get:
      summary: List users
      responses:
        '200':
          description: OK
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account
                - email
                - passwordHash
              properties:
                account:
                  type: string
                name:
                  type: string
                email:
                  type: string
                passwordHash:
                  type: string
                departmentId:
                  type: string
                positionId:
                  type: string
      responses:
        '201':
          description: Created
  /v1/users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    put:
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                status:
                  type: string
                  enum: [active, disabled]
                departmentId:
                  type: string
                positionId:
                  type: string
      responses:
        '200':
          description: OK
    delete:
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/users/{id}/roles:
    post:
      summary: Assign role to user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/roles:
    get:
      summary: List roles
      responses:
        '200':
          description: OK
    post:
      summary: Create role
      responses:
        '201':
          description: Created
  /v1/roles/{id}/users:
    get:
      summary: List users by role
