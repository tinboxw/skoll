    delete:
      summary: Delete file object
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted file object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDeleteAPIResponse'
        '401':
          description: Unauthorized
          x-error-codes: [unauthorized]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          x-error-codes: [file_forbidden]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          x-error-codes: [file_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Storage Error
          x-error-codes: [file_storage_error]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/files/{id}/download:
    get:
      summary: Create file download URL
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, attachment]
            default: attachment
      responses:
        '200':
          description: Short-lived authorized download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadAPIResponse'
        '401':
          description: Unauthorized
          x-error-codes: [unauthorized]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          x-error-codes: [file_forbidden]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          x-error-codes: [file_not_found]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Storage Error
          x-error-codes: [file_storage_error]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/files/multipart/init:
    post:
      summary: Initialize multipart file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileMultipartInitRequest'
      responses:
        '201':
          description: Multipart upload initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMultipartInitAPIResponse'
        '400':
          description: Bad Request
          x-error-codes: [invalid_multipart_request]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          x-error-codes: [unauthorized]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/files/multipart/{uploadId}/parts/{partNumber}:
    put:
      summary: Upload multipart file part
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
        - name: partNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: hash
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Uploaded multipart part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMultipartPartAPIResponse'
        '400':
          description: Bad Request
          x-error-codes: [invalid_multipart_request]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          x-error-codes: [unauthorized]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/files/multipart/{uploadId}/complete:
    post:
      summary: Complete multipart file upload
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileMultipartCompleteRequest'
      responses:
        '200':
          description: Completed multipart file upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetailAPIResponse'
        '400':
          description: Bad Request
          x-error-codes: [invalid_multipart_request, multipart_hash_mismatch]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          x-error-codes: [unauthorized]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/files/multipart/{uploadId}/abort:
    post:
      summary: Abort multipart file upload
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileMultipartAbortRequest'
      responses:
        '200':
          description: Aborted multipart file upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMultipartAbortAPIResponse'
        '400':
          description: Bad Request
          x-error-codes: [invalid_multipart_request]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          x-error-codes: [unauthorized]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Skoll JWT access token. Aggregated plugin API operations require this scheme and declare x-skoll-permission.
  schemas:
    PluginHealthReport:
      type: object
      required: [pluginId, status, code, checkedAt, latencyMillis]
      properties:
        pluginId: {type: string}
        status: {type: string, enum: [healthy, unhealthy, not_applicable]}
        code: {type: string}
        checkedAt: {type: string, format: date-time}
        latencyMillis: {type: integer, format: int64, minimum: 0}
        httpStatus: {type: integer, minimum: 100, maximum: 599}
    PluginReadinessReport:
      type: object
      required: [ready, checkedAt, plugins]
      properties:
        ready: {type: boolean}
        checkedAt: {type: string, format: date-time}
        plugins:
          type: array
          items: {$ref: '#/components/schemas/PluginHealthReport'}
    PluginHealthAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PluginHealthReport'}
    PluginControlPlugin:
      type: object
      required: [id, name, version, enabled, uiMode, level, mountPolicy, systemBuiltin]
      properties:
        id: {type: string}
        name: {type: string}
        nameZhCN: {type: string}
        nameEnUS: {type: string}
        version: {type: string}
        enabled: {type: boolean}
        uiMode: {type: string}
        level: {type: string}
        appId: {type: string}
        mountPolicy: {type: string}
        uiNavPosition: {type: string}
        uiOpenMode: {type: string}
        uiTabMode: {type: string}
        i18nLocales:
          type: array
          items: {type: string}
        uiMenu:
          type: object
          additionalProperties: true
        configSchema:
          type: object
          additionalProperties: true
        frontendEntry: {type: string}
        systemBuiltin: {type: boolean}
    PluginControlRuntime:
      type: object
      required: [state, installedAt]
      properties:
        state: {type: string, enum: [installed, enabled, disabled, uninstalled]}
        installedAt: {type: string, format: date-time}
        enabledAt: {type: string, format: date-time}
        serviceBaseUrl: {type: string, format: uri}
        serviceHealthUrl: {type: string, format: uri}
        health: {$ref: '#/components/schemas/PluginHealthReport'}
    PluginControlPermission:
      type: object
      required: [key]
      properties:
        key: {type: string}
        type: {type: string}
        module: {type: string}
        name: {type: string}
        risk: {type: string}
    PluginControlRoute:
      type: object
      required: [method, path, source]
      properties:
        method: {type: string}
        path: {type: string}
        summary: {type: string}
        permission: {type: string}
        auditAction: {type: string}
        source: {type: string}
    PluginControlDependency:
      type: object
      required: [id]
      properties:
        id: {type: string}
        version: {type: string}
    PluginControlExtensions:
      type: object
      required: [routes, middlewares, events, menus, widgets, settings]
      properties:
        routes: {type: integer, minimum: 0}
        middlewares: {type: integer, minimum: 0}
        events: {type: integer, minimum: 0}
        menus: {type: integer, minimum: 0}
        widgets: {type: integer, minimum: 0}
        settings: {type: integer, minimum: 0}
    PluginControlCapabilities:
      type: object
      required: [hostServices, permissions, routes, dependencies, extensions]
      properties:
        apiVersion: {type: string}
        migrationVersion: {type: string}
        hostServices:
          type: array
          items: {type: string}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/PluginControlPermission'}
        routes:
          type: array
          items: {$ref: '#/components/schemas/PluginControlRoute'}
        dependencies:
          type: array
          items: {$ref: '#/components/schemas/PluginControlDependency'}
        extensions: {$ref: '#/components/schemas/PluginControlExtensions'}
    PluginControlSnapshot:
      type: object
      required: [plugin, capturedAt, staleAfter, runtime, capabilities]
      properties:
        plugin: {$ref: '#/components/schemas/PluginControlPlugin'}
        capturedAt: {type: string, format: date-time}
        staleAfter: {type: string, format: date-time}
        runtime: {$ref: '#/components/schemas/PluginControlRuntime'}
        capabilities: {$ref: '#/components/schemas/PluginControlCapabilities'}
    PluginControlAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PluginControlSnapshot'}
    PluginDataControlTable:
      type: object
      required: [logicalName, physicalName, fields, primaryKey, indexCount, exists, sizeBytes, sizeKnown]
      properties:
        logicalName: {type: string}
        physicalName: {type: string}
        fields:
          type: array
          items: {type: string}
        primaryKey:
          type: array
          items: {type: string}
        indexCount: {type: integer, minimum: 0}
        exists: {type: boolean}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        sizeKnown: {type: boolean}
    PluginDataControlSchema:
      type: object
      required: [available, registered, tables, totalSizeBytes, sizeKnown]
      properties:
        available: {type: boolean}
        registered: {type: boolean}
        namespace: {type: string}
        tables:
          type: array
          items: {$ref: '#/components/schemas/PluginDataControlTable'}
        totalSizeBytes: {type: integer, format: int64, minimum: 0}
        sizeKnown: {type: boolean}
    PluginMigrationStep:
      type: object
      required: [version, name, checksum]
      properties:
        version: {type: integer, minimum: 1}
        name: {type: string}
        checksum: {type: string}
        appliedAt: {type: string, format: date-time}
    PluginDataControlMigration:
      type: object
      required: [currentVersion, applied, pending]
      properties:
        declaredVersion: {type: string}
        currentVersion: {type: integer, minimum: 0}
        applied:
          type: array
          items: {$ref: '#/components/schemas/PluginMigrationStep'}
        pending:
          type: array
          items: {$ref: '#/components/schemas/PluginMigrationStep'}
        error: {type: string}
    PluginDataControlPolicy:
      type: object
      required: [effect]
      properties:
        uninstall: {type: string, enum: [retain, archive, drop]}
        rollback: {type: string, enum: [manual, automatic, none]}
        effect: {type: string, enum: [no_plugin_data, policy_not_declared, retain_data, archive_data, drop_data]}
    PluginDataControlActions:
      type: object
      required: [canRollback, rollbackMaxSteps]
      properties:
        canRollback: {type: boolean}
        rollbackMaxSteps: {type: integer, minimum: 0, maximum: 100}
        blockedReason:
          type: string
          enum: [migrations_not_declared, plugin_must_be_disabled, rollback_policy_blocked, no_applied_migrations]
    PluginDataControlSnapshot:
      type: object
      required: [pluginId, capturedAt, state, schema, migration, policy, actions]
      properties:
        pluginId: {type: string}
        capturedAt: {type: string, format: date-time}
        state: {type: string, enum: [installed, enabled, disabled, uninstalled]}
        schema: {$ref: '#/components/schemas/PluginDataControlSchema'}
        migration: {$ref: '#/components/schemas/PluginDataControlMigration'}
        policy: {$ref: '#/components/schemas/PluginDataControlPolicy'}
        actions: {$ref: '#/components/schemas/PluginDataControlActions'}
    PluginDataControlAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PluginDataControlSnapshot'}
    PluginMigrationRollbackRequest:
      type: object
      additionalProperties: false
      required: [limit, confirmPluginId]
      properties:
        limit: {type: integer, minimum: 1, maximum: 100}
        confirmPluginId: {type: string, description: Must exactly match the id path parameter.}
    PluginMigrationRollbackResult:
      type: object
      required: [operationId, completedAt, rolledBackSteps, snapshot]
      properties:
        operationId: {type: string}
        completedAt: {type: string, format: date-time}
        rolledBackSteps: {type: integer, minimum: 1, maximum: 100}
        snapshot: {$ref: '#/components/schemas/PluginDataControlSnapshot'}
    PluginMigrationRollbackAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PluginMigrationRollbackResult'}
    PluginDiagnosticSummary:
      type: object
      required: [totalJobs, activeJobs, deadLetters, auditEvents, failureCount]
      properties:
        totalJobs: {type: integer, minimum: 0}
        activeJobs: {type: integer, minimum: 0}
        deadLetters: {type: integer, minimum: 0}
        auditEvents: {type: integer, minimum: 0}
        failureCount: {type: integer, minimum: 0}
    PluginDiagnosticJob:
      type: object
      required: [id, kind, status, runAt, maxAttempts, attemptCount, createdAt, updatedAt, canRetry]
      properties:
        id: {type: string}
        kind: {type: string}
        status: {type: string, enum: [scheduled, running, retry_wait, succeeded, dead_letter]}
        runAt: {type: string, format: date-time}
        maxAttempts: {type: integer, minimum: 1}
        attemptCount: {type: integer, minimum: 0}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        deadLetteredAt: {type: string, format: date-time}
        canRetry: {type: boolean}
    PluginDiagnosticAudit:
      type: object
      required: [id, source, action, result, risk, actorId, resourceType, resourceId, occurredAt]
      properties:
        id: {type: string}
        source: {type: string, enum: [host, event]}
        action: {type: string}
        result: {type: string, enum: ['', success, failure, denied]}
        risk: {type: string}
        actorId: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        occurredAt: {type: string, format: date-time}
        traceId: {type: string}
        requestId: {type: string}
        method: {type: string}
        path: {type: string}
        metadata: {type: object, additionalProperties: true}
    PluginDiagnosticCorrelation:
      type: object
      properties:
        processId: {type: string}
        routeId: {type: string}
        jobId: {type: string}
        auditId: {type: string}
        requestId: {type: string}
        traceId: {type: string}
    PluginDiagnosticError:
      type: object
      required: [id, category, severity, summary, occurredAt, correlation]
      properties:
        id: {type: string}
        category: {type: string, enum: [process, route, job, audit]}
        severity: {type: string, enum: [medium, high, critical]}
        summary: {type: string}
        occurredAt: {type: string, format: date-time}
        correlation: {$ref: '#/components/schemas/PluginDiagnosticCorrelation'}
    PluginDiagnosticsSnapshot:
      type: object
      required: [pluginId, capturedAt, health, summary, jobs, audit, errors]
      properties:
        pluginId: {type: string}
        capturedAt: {type: string, format: date-time}
        health: {$ref: '#/components/schemas/PluginHealthReport'}
        summary: {$ref: '#/components/schemas/PluginDiagnosticSummary'}
        jobs:
          type: array
          items: {$ref: '#/components/schemas/PluginDiagnosticJob'}
        audit:
          type: array
          items: {$ref: '#/components/schemas/PluginDiagnosticAudit'}
        errors:
          type: array
          items: {$ref: '#/components/schemas/PluginDiagnosticError'}
    PluginDiagnosticsAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PluginDiagnosticsSnapshot'}
    PluginJobRetryRequest:
      type: object
      additionalProperties: false
      required: [confirmPluginId, confirmJobId]
      properties:
        confirmPluginId: {type: string, description: Must exactly match the id path parameter.}
        confirmJobId: {type: string, description: Must exactly match the jobId path parameter.}
    PluginJobRetryResult:
      type: object
      required: [operationId, completedAt, sourceJobId, retryJob]
      properties:
        operationId: {type: string}
        completedAt: {type: string, format: date-time}
        sourceJobId: {type: string}
        retryJob: {$ref: '#/components/schemas/PluginDiagnosticJob'}
    PluginJobRetryAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PluginJobRetryResult'}
    PluginReadinessAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/PluginReadinessReport'}
    AuthLoginRequest:
      type: object
      required: [account, password]
      additionalProperties: false
      properties:
        account: {type: string, minLength: 1}
        password: {type: string, minLength: 1, format: password}
    AuthUserProfile:
      type: object
      required: [id, account, name, email, role, roles, organizationId, organizationPath]
      properties:
        id: {type: string, minLength: 1}
        account: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        email: {type: string}
        role: {type: string, minLength: 1, description: Primary role for display and audit context}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Trusted role keys resolved from server-side RBAC bindings
          items: {type: string, minLength: 1}
        organizationId:
          type: string
          description: Trusted department ID; empty when the user has no organization assignment
        organizationPath:
          type: array
          uniqueItems: true
          description: Trusted root-to-leaf department ID path ending at organizationId
          items: {type: string, minLength: 1}
    AuthLoginData:
      type: object
      required: [token, tokenType, expiresIn, permissions, user]
      properties:
        token: {type: string, minLength: 1}
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, minimum: 1}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string}
        user: {$ref: '#/components/schemas/AuthUserProfile'}
    AuthLoginResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/AuthLoginData'}
    AuthReverifyRequest:
      type: object
      required: [password, audience]
      additionalProperties: false
      properties:
        password: {type: string, minLength: 1, format: password}
        audience: {type: string, minLength: 1, maxLength: 128}
    AuthReverifyData:
      type: object
      required: [proof, verificationId, verifiedAt, expiresAt]
      properties:
        proof: {type: string, minLength: 1, maxLength: 4096}
        verificationId: {type: string, minLength: 1}
        verifiedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    AuthReverifyResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/AuthReverifyData'}
    AuthProfileData:
      allOf:
        - {$ref: '#/components/schemas/AuthUserProfile'}
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              uniqueItems: true
              items: {type: string}
    AuthProfileResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/AuthProfileData'}
    MessageResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    AuditActorRef:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
    AuditResourceRef:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
        name:
          type: string
    AuditTraceContext:
      type: object
      properties:
        traceId:
          type: string
        requestId:
          type: string
        method:
          type: string
        path:
          type: string
        ip:
          type: string
        userAgent:
          type: string
    AuditEvent:
      type: object
      required:
        - id
        - type
        - action
        - actor
        - resource
        - result
        - risk
        - occurredAt
      properties:
        id:
          type: string
        type:
          type: string
          enum: [operation, login, error, plugin, security]
        action:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}$'
        actor:
          $ref: '#/components/schemas/AuditActorRef'
        resource:
          $ref: '#/components/schemas/AuditResourceRef'
        result:
          type: string
          enum: [success, failure, denied]
        risk:
          type: string
          enum: [low, medium, high, critical]
        trace:
          $ref: '#/components/schemas/AuditTraceContext'
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    AuditEventListData:
      type: object
      required:
        - items
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Optional total count when the backing store can compute it efficiently.
    AuditEventListAPIResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          required:
            - data
          properties:
            data:
              $ref: '#/components/schemas/AuditEventListData'
    AuditEventDiff:
      type: object
      properties:
        before:
          type: object
          additionalProperties: true
        after:
          type: object
          additionalProperties: true
        summary:
          type: array
          items:
            type: string
    AuditEventDetail:
      allOf:
        - $ref: '#/components/schemas/AuditEvent'
        - type: object
          properties:
            sourceData:
              type: object
              additionalProperties: true
              description: Raw source log payload, such as login_log or error_log fields.
            diff:
              $ref: '#/components/schemas/AuditEventDiff'
    AuditEventDetailData:
      type: object
      required:
        - item
