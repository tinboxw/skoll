openapi: 3.0.3
info:
  title: Skoll API
  version: 1.0.0
  description: OpenAPI document for Skoll core HTTP endpoints.
servers:
  - url: __API_BASE_PREFIX__
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginReadinessAPIResponse'}
        '503':
          description: One or more enabled plugin backends are unhealthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginReadinessAPIResponse'}
  /v1/auth/login:
    post:
      summary: Login with account and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthLoginResponse'}
        '400':
          description: Invalid authentication request (`invalid_auth_request` or `invalid_credentials`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Invalid credentials or trusted organization assignment (`invalid_credentials` or `invalid_organization`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/auth/reverify:
    post:
      summary: Reverify the current user for an electronic workflow signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthReverifyRequest'
      responses:
        '200':
          description: Short-lived proof bound to the authenticated user, audience, and workflow-signature purpose
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthReverifyResponse'}
        '400':
          description: Invalid reverification request or audience
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Invalid session or password
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/auth/logout:
    post:
      summary: Logout current user
      responses:
        '200':
          description: OK
  /v1/auth/me:
    get:
      summary: Get current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthProfileResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/auth/me/profile:
    put:
      summary: Update current user profile
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
  /v1/auth/me/password:
    patch:
      summary: Update current user password
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /v1/users:
    get:
      summary: List users
      responses:
        '200':
          description: OK
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account
                - email
                - passwordHash
              properties:
                account:
                  type: string
                name:
                  type: string
                email:
                  type: string
                passwordHash:
                  type: string
                departmentId:
                  type: string
                positionId:
                  type: string
      responses:
        '201':
          description: Created
  /v1/users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    put:
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                status:
                  type: string
                  enum: [active, disabled]
                departmentId:
                  type: string
                positionId:
                  type: string
      responses:
        '200':
          description: OK
    delete:
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/users/{id}/roles:
    post:
      summary: Assign role to user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/roles:
    get:
      summary: List roles
      responses:
        '200':
          description: OK
    post:
      summary: Create role
      responses:
        '201':
          description: Created
  /v1/roles/{id}/users:
    get:
      summary: List users by role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /v1/rbac/check:
    post:
      summary: Check authorization
      responses:
        '200':
          description: Permission decision with resolved data scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  scope:
                    type: string
                    enum: [self, department, department_tree, custom, all]
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /v1/rbac/data-scope:
    get:
      summary: Resolve the authenticated user's effective data scope
      description: The decision is derived from signed JWT claims and RBAC grants. Request fields cannot supply user or organization scope.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
        - name: action
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trusted data-scope decision for the current user
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    required: [scope, all]
                    properties:
                      scope:
                        type: string
                        enum: [self, department, department_tree, all]
                      all:
                        type: boolean
                      userIds:
                        type: array
                        items:
                          type: string
                      departmentIds:
                        type: array
                        items:
                          type: string
        '400':
          description: Missing resource or action
        '401':
          description: Unauthorized
        '403':
          description: Scope is not granted or cannot be resolved
  /v1/rbac/bindings:
    get:
      summary: List role bindings by subject
      parameters:
        - name: subjectType
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/rbac/bindings/{id}:
    delete:
      summary: Delete a role binding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/audit:
    get:
      summary: List audit events
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [operation, login, error, plugin, security]
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}$'
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure, denied]
        - name: risk
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Audit event list wrapped in the standard response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListAPIResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
    delete:
      summary: Clear audit records by time range
      responses:
        '200':
          description: OK
  /v1/audit/{id}:
    get:
      summary: Get audit event detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit event detail wrapped in the standard response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventDetailAPIResponse'
        '403':
          description: Forbidden
        '404':
          description: Not Found
  /v1/audit/export:
    get:
      summary: Export audit event source data as CSV
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [operation, login, error, plugin, security]
        - name: actorId
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}\.[a-z][a-z0-9_-]{0,63}$'
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure, denied]
        - name: risk
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: CSV with fixed columns eventId and sourceData
          content:
            text/csv:
              schema:
                type: string
                description: CSV header is `eventId,sourceData`; sourceData is compact JSON encoded as a CSV field.
              examples:
                auditEventSourceData:
                  value: |
                    eventId,sourceData
                    event-1,"{""ip"":""127.0.0.1"",""result"":""denied""}"
        '400':
          description: Bad Request
  /v1/audit/actors/{actorId}:
    get:
      summary: List audit records by actor
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/plugins:
    get:
      summary: List plugins
      responses:
        '200':
          description: OK
  /v1/plugins/marketplace/local:
    get:
      summary: List local plugin marketplace entries
      parameters:
        - name: pluginsRoot
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalMarketplaceAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/preflight:
    post:
      summary: Run plugin install preflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginPathRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginInstallPreflightAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/{id}:
    get:
      summary: Get plugin detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /v1/plugins/{id}/control:
    get:
      summary: Get the authoritative plugin control-center snapshot
      description: Returns plugin identity, runtime observation freshness, health, routes, permissions, dependencies, extensions, and available host services in one inspectable snapshot. Health probe failures remain represented in the successful snapshot.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current plugin control snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginControlAPIResponse'
        '404':
          description: Plugin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Plugin manager is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/{id}/data-control:
    get:
      summary: Inspect plugin-owned data and migration state
      description: Returns the host schema registry, physical storage observation, durable migration ledger, declared data policies, and currently allowed lifecycle actions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current plugin data-control snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDataControlAPIResponse'
        '404':
          description: Plugin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Plugin data control is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/{id}/migrations/rollback:
    post:
      summary: Roll back applied plugin data migrations
      description: Requires the super_admin role, an exact plugin-ID confirmation, a disabled plugin, an automatic rollback policy, and a limit no greater than the applied migration count. The migration sink and audit service persist the outcome.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginMigrationRollbackRequest'
      responses:
        '200':
          description: Migration rollback completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginMigrationRollbackAPIResponse'
        '400':
          description: Invalid confirmation or rollback limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Super administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Plugin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Current plugin state or policy blocks rollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/{id}/diagnostics:
    get:
      summary: Inspect correlated plugin diagnostics
      description: Aggregates current process health, namespaced jobs, host audit records, HTTP audit events, and derived error signals for one plugin.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: jobStatus
          in: query
          schema: {type: string, enum: [scheduled, running, retry_wait, succeeded, dead_letter]}
        - name: auditResult
          in: query
          schema: {type: string, enum: [success, failure, denied]}
        - name: correlation
          in: query
          description: Case-insensitive job, audit, request, trace, route, process, or error identifier search.
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Correlated plugin diagnostic snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginDiagnosticsAPIResponse'}
        '400':
          description: Invalid diagnostic filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Plugin not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Plugin diagnostics are unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/plugins/{id}/jobs/{jobId}/retry:
    post:
      summary: Retry a plugin dead-letter job as a new job
      description: Requires the super_admin role and exact plugin and job confirmations. The original dead-letter record remains unchanged and the new job plus operation are durably audited.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: jobId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginJobRetryRequest'}
      responses:
        '200':
          description: Retry job created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginJobRetryAPIResponse'}
        '400':
          description: Invalid or mismatched confirmation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Super administrator role required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Plugin or job not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Job is not in the dead-letter state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/plugins/{id}/config:
    get:
      summary: Get plugin config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      summary: Update plugin config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/plugins/{id}/health:
    get:
      summary: Check one plugin backend health
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin backend is healthy or does not require a backend probe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginHealthAPIResponse'}
        '404':
          description: Plugin not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Plugin backend is unhealthy or health checking is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginHealthAPIResponse'}
  /v1/plugins/dev/rollout:
    post:
      summary: Execute plugin rollout with task tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolloutRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/rollback:
    post:
      summary: Execute plugin rollback with task tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/rollout-tasks:
    get:
      summary: List rollout tasks
      parameters:
        - name: pluginId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutTaskListAPIResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /v1/plugins/dev/rollout-tasks/{taskId}:
    get:
      summary: Get rollout task detail
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutTaskGetAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/dev/rollout-tasks/{taskId}/logs:
    get:
      summary: Get rollout task logs
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolloutTaskLogsAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/plugins/dev/release-orders:
    post:
      summary: Create plugin release order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseOrderCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOrderCreateAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    get:
      summary: List plugin release orders
      parameters:
        - name: pluginsRoot
          in: query
          required: true
          schema:
            type: string
        - name: pluginId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOrderListAPIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
