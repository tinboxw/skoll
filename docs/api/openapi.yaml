          description: Drug recall detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrugRecallItemAPIResponse'}
        '404':
          description: Drug recall not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/drug-recalls/{id}/tasks/{taskId}/complete:
    post:
      summary: Complete one affected-customer recall task
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: taskId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DrugRecallTaskCompleteRequest'}
      responses:
        '200':
          description: Recall task completed; the order completes after its last task
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DrugRecallItemAPIResponse'}
        '400':
          description: Invalid task, actor, or completion note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/cold-chain-contexts:
    get:
      summary: List stock balances eligible for cold-chain recording
      responses:
        '200':
          description: Eligible cold-chain inventory contexts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColdChainContextListAPIResponse'}
        '400':
          description: Inventory or warehouse context lookup failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/cold-chain-records:
    get:
      summary: List immutable cold-chain readings
      parameters:
        - name: batchId
          in: query
          schema: {type: string}
        - name: warehouseId
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Cold-chain record list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColdChainRecordListAPIResponse'}
        '400':
          description: Invalid record filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      summary: Create an immutable cold-chain reading for an inventory balance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ColdChainRecordCreateRequest'}
      responses:
        '201':
          description: Cold-chain record created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColdChainRecordItemAPIResponse'}
        '400':
          description: Invalid reading or ineligible stock balance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/cold-chain-anomalies:
    get:
      summary: List cold-chain risk-dashboard anomalies
      parameters:
        - name: activeOnly
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Cold-chain anomaly list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColdChainAnomalyListAPIResponse'}
        '400':
          description: Invalid anomaly filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/cold-chain-jobs:
    get:
      summary: List cold-chain anomaly scan jobs
      responses:
        '200':
          description: Cold-chain job list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColdChainJobListAPIResponse'}
    post:
      summary: Run a cold-chain anomaly scan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ColdChainRunRequest'}
      responses:
        '201':
          description: Cold-chain scan completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColdChainJobItemAPIResponse'}
        '400':
          description: Invalid humidity policy or scan failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/cold-chain-jobs/{id}/retry:
    post:
      summary: Retry a failed cold-chain anomaly scan
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ColdChainRetryRequest'}
      responses:
        '200':
          description: Cold-chain scan retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ColdChainJobItemAPIResponse'}
        '400':
          description: Job is missing, not failed, or retry failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/compliance-dashboard:
    get:
      summary: Read active compliance risks across qualification, complaint, recall, and cold-chain sources
      parameters:
        - name: keyword
          in: query
          schema: {type: string}
        - name: risk
          in: query
          schema: {type: string, enum: [high, medium]}
        - name: source
          in: query
          schema: {type: string, enum: [qualification, quality_complaint, drug_recall, cold_chain]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Compliance audit dashboard snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComplianceDashboardAPIResponse'}
        '400':
          description: Invalid filter or source aggregation failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Missing compliance dashboard read permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/compliance-dashboard/export:
    get:
      summary: Export filtered compliance risk evidence as UTF-8 CSV
      parameters:
        - name: keyword
          in: query
          schema: {type: string}
        - name: risk
          in: query
          schema: {type: string, enum: [high, medium]}
        - name: source
          in: query
          schema: {type: string, enum: [qualification, quality_complaint, drug_recall, cold_chain]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Filtered compliance risk CSV
          content:
            text/csv:
              schema: {type: string, format: binary}
        '400':
          description: Invalid filter, source aggregation failure, or audit failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Missing compliance dashboard export permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/business-metrics:
    get:
      summary: Read bounded operational and sales metrics for the Pharma OA dashboard
      parameters:
        - name: from
          in: query
          description: Inclusive window start; must be paired with to and use RFC3339 or YYYY-MM-DD
          schema: {type: string}
        - name: to
          in: query
          description: Inclusive window end; must be paired with from and use RFC3339 or YYYY-MM-DD
          schema: {type: string}
        - name: bucket
          in: query
          schema: {type: string, enum: [day, week, month], default: day}
        - name: qualificationDays
          in: query
          schema: {type: integer, minimum: 1, maximum: 365, default: 30}
      responses:
        '200':
          description: Aggregated business metrics snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessMetricsAPIResponse'}
        '400':
          description: Invalid or unbounded query, or source aggregation failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Missing business metrics read permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/report-export-jobs:
    get:
      summary: List report export jobs owned by the authenticated actor
      responses:
        '200':
          description: Authorized report export jobs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportExportJobListAPIResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Missing report export read permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      summary: Queue an asynchronous Pharma OA report export
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportExportCreateRequest'}
      responses:
        '202':
          description: Report export accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportExportJobItemAPIResponse'}
        '400':
          description: Invalid report type or unbounded metrics window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Missing report export create permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/report-export-jobs/{id}:
    get:
      summary: Read an owned report export job
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Report export job detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportExportJobItemAPIResponse'}
        '403':
          description: Report export job belongs to another actor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Report export job not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/report-export-jobs/{id}/retry:
    post:
      summary: Retry an owned failed report export job
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '202':
          description: Report export retry accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportExportJobItemAPIResponse'}
        '403':
          description: Missing retry permission or cross-owner access
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Report export job not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Only failed report exports can be retried
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/report-export-jobs/{id}/download:
    get:
      summary: Download an owned completed report export
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Generated CSV report
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string, format: binary}
        '403':
          description: Missing download permission or cross-owner access
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Report export job not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Report export has not completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/demo-seed/status:
    get:
      summary: Read Pharma OA demo seed status
      responses:
        '200':
          description: Current demo seed state and entity references
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoSeedAPIResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Missing demo seed read permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /v1/pharma-oa/demo-seed/apply:
    post:
      summary: Initialize the complete Pharma OA demo scenario
      responses:
        '200':
          description: Demo scenario initialized or existing result reused
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoSeedAPIResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Missing demo seed apply permission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          description: Demo seed failed and exposes its terminal stage through the status operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Skoll JWT access token. Aggregated plugin API operations require this scheme and declare x-skoll-permission.
  schemas:
    PharmaMasterListData:
      type: object
      required: [items, offset, limit, total, hasMore, nextCursor, sort]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 200}
        total: {type: integer, format: int64, minimum: 0}
        hasMore: {type: boolean}
        nextCursor:
          type: string
          description: Empty on the final page; otherwise pass this value as the next request cursor.
        sort:
          type: string
          enum: ['code:asc']
    PharmaMasterListAPIResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PharmaMasterListData'
    AuthLoginRequest:
      type: object
      required: [account, password]
      additionalProperties: false
      properties:
        account: {type: string, minLength: 1}
        password: {type: string, minLength: 1, format: password}
    AuthUserProfile:
      type: object
      required: [id, account, name, email, role, roles, organizationId, organizationPath]
      properties:
        id: {type: string, minLength: 1}
        account: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        email: {type: string}
        role: {type: string, minLength: 1, description: Primary role for display and audit context}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Trusted role keys resolved from server-side RBAC bindings
          items: {type: string, minLength: 1}
        organizationId:
          type: string
          description: Trusted department ID; empty when the user has no organization assignment
        organizationPath:
          type: array
          uniqueItems: true
          description: Trusted root-to-leaf department ID path ending at organizationId
          items: {type: string, minLength: 1}
    AuthLoginData:
      type: object
      required: [token, tokenType, expiresIn, permissions, user]
      properties:
        token: {type: string, minLength: 1}
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, minimum: 1}
        permissions:
          type: array
          uniqueItems: true
          items: {type: string}
        user: {$ref: '#/components/schemas/AuthUserProfile'}
    AuthLoginResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/AuthLoginData'}
    AuthProfileData:
      allOf:
        - {$ref: '#/components/schemas/AuthUserProfile'}
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              uniqueItems: true
              items: {type: string}
    AuthProfileResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/AuthProfileData'}
    ContractCreateRequest:
      type: object
      required: [number, title, partyType, partyId, approverId, amount, currency, effectiveAt, expiresAt, attachmentIds]
      properties:
        number: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        partyType: {type: string, enum: [supplier, customer]}
        partyId: {type: string, minLength: 1}
        ownerId: {type: string}
        approverId: {type: string, minLength: 1}
        amount: {type: number, minimum: 0}
        currency: {type: string, minLength: 1}
        effectiveAt: {type: string, format: date}
        expiresAt: {type: string, format: date}
        attachmentIds:
          type: array
          minItems: 1
          items: {type: string}
    ContractActionRequest:
      type: object
      properties:
        actorId: {type: string}
        comment: {type: string}
    ContractExpiryScanRequest:
      type: object
      properties:
        days: {type: integer, minimum: 1, default: 30}
        actorId: {type: string}
    ContractAttachment:
      type: object
      required: [fileId, fileName, mime, size]
      properties:
        fileId: {type: string}
        fileName: {type: string}
        mime: {type: string}
        size: {type: integer, format: int64, minimum: 0}
    AuditMeta:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Contract:
      type: object
      required: [id, number, title, partyType, partyId, partyName, ownerId, approverId, amount, currency, effectiveAt, expiresAt, attachments, workflowInstanceId, status, meta]
      properties:
        id: {type: string}
        number: {type: string}
        title: {type: string}
        partyType: {type: string, enum: [supplier, customer]}
        partyId: {type: string}
        partyName: {type: string}
        ownerId: {type: string}
        approverId: {type: string}
        amount: {type: number}
        currency: {type: string}
        effectiveAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/ContractAttachment'}
        workflowInstanceId: {type: string}
        status: {type: string, enum: [pending_approval, active, rejected, expired]}
        approvedBy: {type: string}
        approvedAt: {type: string, format: date-time}
        rejectedBy: {type: string}
        rejectedAt: {type: string, format: date-time}
        reminderNotificationId: {type: string}
        meta: {$ref: '#/components/schemas/AuditMeta'}
    ContractExpiryReminder:
      type: object
      required: [contractId, contractNumber, partyType, partyId, partyName, expiresAt, recipientId, notificationId, targetPath]
      properties:
        contractId: {type: string}
        contractNumber: {type: string}
        partyType: {type: string, enum: [supplier, customer]}
        partyId: {type: string}
        partyName: {type: string}
        expiresAt: {type: string, format: date-time}
        recipientId: {type: string}
        notificationId: {type: string}
        targetPath: {type: string}
    ContractExpiryScanResult:
      type: object
      required: [matchedCount, createdCount, reminders]
      properties:
        matchedCount: {type: integer}
        createdCount: {type: integer}
        reminders:
          type: array
          items: {$ref: '#/components/schemas/ContractExpiryReminder'}
    ContractItemData:
      type: object
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/Contract'}
    ContractListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Contract'}
    ContractExpiryScanData:
      type: object
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/ContractExpiryScanResult'}
    ContractItemAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ContractItemData'}
    ContractListAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ContractListData'}
    ContractExpiryScanAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/ContractExpiryScanData'}
    QualificationScanRequest:
      type: object
      properties:
        days: {type: integer, minimum: 1, maximum: 365, default: 30}
        actorId: {type: string}
    QualificationRecord:
      type: object
      required: [id, subjectType, subjectId, subjectCode, subjectName, subjectStatus, qualificationId, qualificationName, number, expiresAt, status, attachmentCount, recipientId, targetPath]
      properties:
        id: {type: string}
        subjectType: {type: string, enum: [employee, supplier, customer]}
        subjectId: {type: string}
        subjectCode: {type: string}
        subjectName: {type: string}
        subjectStatus: {type: string}
        qualificationId: {type: string}
        qualificationName: {type: string}
        number: {type: string}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [valid, expiring, expired, permanent]}
        attachmentCount: {type: integer, minimum: 0}
        recipientId: {type: string}
        targetPath: {type: string}
        reminderNotificationId: {type: string}
    QualificationScanResult:
      type: object
      required: [matchedCount, createdCount, reminders]
      properties:
        matchedCount: {type: integer, minimum: 0}
        createdCount: {type: integer, minimum: 0}
        reminders:
          type: array
          items: {$ref: '#/components/schemas/QualificationRecord'}
    QualificationListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QualificationRecord'}
    QualificationScanData:
      type: object
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/QualificationScanResult'}
    QualificationListAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/QualificationListData'}
    QualificationScanAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/QualificationScanData'}
    QualityComplaintBatch:
      type: object
      required: [id, productId, batchNo, productionDate, expiresAt]
      properties:
        id: {type: string}
        productId: {type: string}
        batchNo: {type: string}
        productionDate: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    QualityComplaintBatchListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/QualityComplaintBatch'}
    QualityComplaintBatchListAPIResponse:
      allOf:
        - {$ref: '#/components/schemas/MessageResponse'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/QualityComplaintBatchListData'}
    QualityComplaintCreateRequest:
      type: object
      required: [number, title, description, customerId, productId, batchId, handlerId, attachmentIds]
      properties:
        number: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        customerId: {type: string, minLength: 1}
        productId: {type: string, minLength: 1}
        batchId: {type: string, minLength: 1}
        reporterId: {type: string}
        handlerId: {type: string, minLength: 1}
        attachmentIds:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
    QualityComplaintActionRequest:
      type: object
      required: [conclusion]
      properties:
        actorId: {type: string}
        conclusion: {type: string, minLength: 1}
    QualityComplaint:
      type: object
      required: [id, number, title, description, customerId, customerName, productId, productName, batchId, batchNo, reporterId, handlerId, attachments, workflowInstanceId, status, meta]
      properties:
        id: {type: string}
        number: {type: string}
        title: {type: string}
        description: {type: string}
        customerId: {type: string}
        customerName: {type: string}
        productId: {type: string}
        productName: {type: string}
