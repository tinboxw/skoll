<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Monolith Plugin</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: "Avenir Next", "Segoe UI", sans-serif; color: #172229; background: #f6f7f2; }
    .page { max-width: 1080px; margin: 0 auto; padding: 28px 18px 36px; }
    .hero, .card { border: 1px solid #d7ddcf; background: #fff; border-radius: 16px; padding: 14px; }
    .hero-actions { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
    .grid { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .two-col { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 12px; }
    button, input, select, textarea { font: inherit; }
    button { border: 1px solid #0f766e; border-radius: 999px; min-height: 36px; padding: 8px 15px; background: #0f766e; color: #fff; cursor: pointer; }
    button.ghost { border-color: #d7ddcf; background: #e7efeb; color: #172229; }
    pre { margin: 0; min-height: 220px; border-radius: 10px; background: #111c22; color: #ddede8; padding: 11px; white-space: pre-wrap; }
    @media (max-width: 840px) { .two-col { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="./style.css?v=20260521" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Monolith Experience</p>
      <h1>Helios Works Operations Studio</h1>
      <p class="lead">A full demo homepage delivered by one plugin package: editorial storytelling, operational widgets, and backend-backed data views.</p>
      <div class="hero-actions">
        <button id="load-widgets">Refresh Widgets</button>
        <button id="load-manifest" class="ghost">Inspect Manifest</button>
      </div>
    </header>

    <section class="grid" id="widget-grid"></section>

    <section class="section two-col">
      <article class="card">
        <h2>Studio Programs</h2>
        <ul id="program-list" class="program-list"></ul>
      </article>
      <article class="card">
        <h2>Runtime Output</h2>
        <pre id="output">Press a button to load live monolith data.</pre>
      </article>
    </section>
  </main>
  <script src="./app.js?v=20260521"></script>
</body>
</html>
