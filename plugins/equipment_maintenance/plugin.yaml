id: equipment_maintenance
name: Equipment Maintenance
name_zh_cn: 设备维保
name_en_us: Equipment Maintenance
version: 0.1.0
api_version: v1
migration_version: 0.1.0
description: Independent equipment maintenance proof plugin for assets, work orders, inspections, spare parts, and operational dashboards.
ui_mode: separated
level: app
app_id: equipment_maintenance
mount_policy: mixed
ui_nav_position: sidebar
ui_open_mode: integrated
ui_tab_mode: fixed
frontend_entry: /skoll/plugins/equipment-maintenance
service_base_url: http://127.0.0.1:18092
service_health_url: http://127.0.0.1:18092/health
vendor: Skoll Maintainers
vendor_url: https://github.com/tinboxw/skoll
i18n_locales:
  - zh-CN
  - en-US

ui_menu:
  key: plugin.equipment_maintenance
  parent_key: plugins
  label: Equipment Maintenance
  label_zh_cn: 设备维保
  label_en_us: Equipment Maintenance
  path: /skoll/plugins/equipment-maintenance
  component: PluginRuntime
  icon: wrench
  order: 220
  visible: true
  required_permissions:
    - equipment_maintenance.menu.read

config_schema:
  title: Equipment Maintenance Config
  title_zh_cn: 设备维保配置
  title_en_us: Equipment Maintenance Config
  description: Current operational thresholds used by planning, approval, and stock-alert workflows.
  fields:
    - key: equipment_maintenance.maintenance_due_days
      label: Maintenance due horizon
      label_zh_cn: 保养到期预警天数
      label_en_us: Maintenance due horizon
      type: number
      required: true
      default: 14
      min: 1
      max: 90
    - key: equipment_maintenance.low_stock_threshold
      label: Low stock threshold
      label_zh_cn: 备件低库存阈值
      label_en_us: Low stock threshold
      type: number
      required: true
      default: 5
      min: 0
      max: 100000
    - key: equipment_maintenance.approval_cost_limit
      label: Approval cost limit
      label_zh_cn: 工单审批金额阈值
      label_en_us: Approval cost limit
      type: number
      required: true
      default: 1000
      min: 0
      max: 100000000

