version: 1
tables:
  - name: employees
    primary_key: [id]
    fields:
      - name: id
        type: string
        filterable: true
        sortable: true
      - name: code
        type: string
        mutable: true
        filterable: true
        sortable: true
      - name: name
        type: string
        mutable: true
        filterable: true
        sortable: true
      - name: department_id
        type: string
        mutable: true
        filterable: true
        sortable: true
      - name: position_id
        type: string
        mutable: true
        filterable: true
        sortable: true
      - name: employment_status
        type: string
        mutable: true
        filterable: true
        sortable: true
      - name: phone
        type: string
        mutable: true
        filterable: true
      - name: email
        type: string
        mutable: true
        filterable: true
      - name: hire_date
        type: timestamp
        mutable: true
        filterable: true
        sortable: true
      - name: left_at
        type: timestamp
        nullable: true
        mutable: true
        filterable: true
        sortable: true
      - name: leave_reason
        type: string
        nullable: true
        mutable: true
      - name: attachments
        type: json
        mutable: true
      - name: certificates
        type: json
        mutable: true
    indexes:
      - fields: [code]
        unique: true
      - fields: [employment_status, name]
      - fields: [department_id, position_id]
  - name: parties
    primary_key: [id]
    fields:
      - {name: id, type: string, filterable: true, sortable: true}
      - {name: party_type, type: string, mutable: true, filterable: true, sortable: true}
      - {name: code, type: string, mutable: true, filterable: true, sortable: true}
      - {name: name, type: string, mutable: true, filterable: true, sortable: true}
      - {name: unified_social_credit_code, type: string, mutable: true, filterable: true, sortable: true}
      - {name: region, type: string, mutable: true, filterable: true, sortable: true}
      - {name: rating, type: integer, mutable: true, filterable: true, sortable: true}
      - {name: status, type: string, mutable: true, filterable: true, sortable: true}
      - {name: disable_reason, type: string, nullable: true, mutable: true}
      - {name: contacts, type: json, mutable: true}
      - {name: addresses, type: json, mutable: true}
      - {name: settlement_terms, type: json, mutable: true}
    indexes:
      - {fields: [party_type, code], unique: true}
      - {fields: [party_type, unified_social_credit_code], unique: true}
      - {fields: [party_type, status, name]}
  - name: catalogs
    primary_key: [id]
    fields:
      - {name: id, type: string, filterable: true, sortable: true}
      - {name: catalog_type, type: string, mutable: true, filterable: true, sortable: true}
      - {name: code, type: string, mutable: true, filterable: true, sortable: true}
      - {name: name, type: string, mutable: true, filterable: true, sortable: true}
      - {name: description, type: string, mutable: true, filterable: true}
      - {name: parent_id, type: string, nullable: true, mutable: true, filterable: true}
      - {name: symbol, type: string, nullable: true, mutable: true, filterable: true}
      - {name: decimal_places, type: integer, mutable: true, filterable: true}
      - {name: unified_social_credit_code, type: string, nullable: true, mutable: true, filterable: true}
      - {name: license_number, type: string, nullable: true, mutable: true, filterable: true}
      - {name: status, type: string, mutable: true, filterable: true, sortable: true}
      - {name: disable_reason, type: string, nullable: true, mutable: true}
    indexes:
      - {fields: [catalog_type, code], unique: true}
      - {fields: [catalog_type, unified_social_credit_code], unique: true}
      - {fields: [catalog_type, status, name]}
  - name: products
    primary_key: [id]
    fields:
      - {name: id, type: string, filterable: true, sortable: true}
      - {name: code, type: string, mutable: true, filterable: true, sortable: true}
      - {name: sku, type: string, mutable: true, filterable: true, sortable: true}
      - {name: name, type: string, mutable: true, filterable: true, sortable: true}
      - {name: generic_name, type: string, mutable: true, filterable: true, sortable: true}
      - {name: category_id, type: string, mutable: true, filterable: true}
      - {name: unit_id, type: string, mutable: true, filterable: true}
      - {name: manufacturer_id, type: string, mutable: true, filterable: true}
      - {name: dosage_form, type: string, mutable: true, filterable: true}
      - {name: specification, type: string, mutable: true, filterable: true}
      - {name: approval_number, type: string, mutable: true, filterable: true}
      - {name: barcode, type: string, nullable: true, mutable: true, filterable: true}
      - {name: storage_condition, type: string, mutable: true, filterable: true}
      - {name: temperature_min, type: integer, mutable: true, filterable: true}
      - {name: temperature_max, type: integer, mutable: true, filterable: true}
      - {name: status, type: string, mutable: true, filterable: true, sortable: true}
      - {name: disable_reason, type: string, nullable: true, mutable: true}
    indexes:
      - {fields: [code], unique: true}
      - {fields: [sku], unique: true}
      - {fields: [approval_number], unique: true}
      - {fields: [status, name]}
      - {fields: [category_id, unit_id, manufacturer_id]}
  - name: qualification_types
    primary_key: [id]
    fields:
      - {name: id, type: string, filterable: true, sortable: true}
      - {name: code, type: string, mutable: true, filterable: true, sortable: true}
      - {name: name, type: string, mutable: true, filterable: true, sortable: true}
      - {name: subject_type, type: string, mutable: true, filterable: true, sortable: true}
      - {name: business_gate, type: string, mutable: true, filterable: true, sortable: true}
      - {name: description, type: string, mutable: true, filterable: true}
      - {name: validity_days, type: integer, mutable: true, filterable: true}
      - {name: alert_days, type: integer, mutable: true, filterable: true}
      - {name: evidence_required, type: boolean, mutable: true, filterable: true}
      - {name: business_required, type: boolean, mutable: true, filterable: true}
      - {name: status, type: string, mutable: true, filterable: true, sortable: true}
      - {name: disable_reason, type: string, nullable: true, mutable: true}
    indexes:
      - {fields: [code], unique: true}
      - {fields: [subject_type, business_gate, status]}
  - name: qualifications
    primary_key: [id]
    fields:
      - {name: id, type: string, filterable: true, sortable: true}
      - {name: type_id, type: string, mutable: true, filterable: true, sortable: true}
      - {name: subject_type, type: string, mutable: true, filterable: true, sortable: true}
      - {name: subject_id, type: string, mutable: true, filterable: true, sortable: true}
      - {name: certificate_number, type: string, mutable: true, filterable: true, sortable: true}
      - {name: issuer, type: string, mutable: true, filterable: true}
      - {name: valid_from, type: timestamp, mutable: true, filterable: true, sortable: true}
      - {name: valid_to, type: timestamp, mutable: true, filterable: true, sortable: true}
      - {name: status, type: string, mutable: true, filterable: true, sortable: true}
      - {name: evidence_file_id, type: string, nullable: true, mutable: true, filterable: true}
      - {name: evidence_file_name, type: string, nullable: true, mutable: true}
      - {name: evidence_file_hash, type: string, nullable: true, mutable: true}
      - {name: review_comment, type: string, nullable: true, mutable: true}
      - {name: submitted_at, type: timestamp, nullable: true, mutable: true, filterable: true}
      - {name: reviewed_at, type: timestamp, nullable: true, mutable: true, filterable: true}
      - {name: reviewed_by, type: string, nullable: true, mutable: true, filterable: true}
      - {name: revoked_at, type: timestamp, nullable: true, mutable: true, filterable: true}
      - {name: last_alert_key, type: string, nullable: true, mutable: true, filterable: true}
    indexes:
      - {fields: [type_id, subject_id, certificate_number], unique: true}
      - {fields: [subject_type, subject_id, status]}
      - {fields: [status, valid_to]}
  - name: oa_requests
    primary_key: [id]
    fields:
      - {name: id, type: string, filterable: true, sortable: true}
      - {name: request_type, type: string, mutable: true, filterable: true, sortable: true}
      - {name: title, type: string, mutable: true, filterable: true, sortable: true}
      - {name: description, type: string, nullable: true, mutable: true, filterable: true}
      - {name: form_data, type: json, mutable: true}
      - {name: status, type: string, mutable: true, filterable: true, sortable: true}
      - {name: approver_id, type: string, mutable: true, filterable: true}
      - {name: approver_name, type: string, mutable: true, filterable: true}
      - {name: workflow_definition_id, type: string, nullable: true, mutable: true, filterable: true}
      - {name: workflow_instance_id, type: string, nullable: true, mutable: true, filterable: true}
      - {name: submitted_at, type: timestamp, nullable: true, mutable: true, filterable: true, sortable: true}
      - {name: last_operation_key, type: string, mutable: true, filterable: true}
    indexes:
      - {fields: [status, updated_at]}
      - {fields: [request_type, updated_at]}
      - {fields: [workflow_instance_id]}
