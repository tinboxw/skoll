      - {name: valid_from, type: timestamp, mutable: true, filterable: true, sortable: true}
      - {name: valid_to, type: timestamp, mutable: true, filterable: true, sortable: true}
      - {name: status, type: string, mutable: true, filterable: true, sortable: true}
      - {name: evidence_file_id, type: string, nullable: true, mutable: true, filterable: true}
      - {name: evidence_file_name, type: string, nullable: true, mutable: true}
      - {name: evidence_file_hash, type: string, nullable: true, mutable: true}
