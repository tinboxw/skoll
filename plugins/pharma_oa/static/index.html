<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>员工管理 - 医药 OA</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main class="employee-workspace" id="app" data-state="loading">
			<header class="page-header">
				<div>
					<p class="eyebrow" data-i18n="module">医药 OA · 人力资源</p>
					<h1 data-i18n="title">员工管理</h1>
					<p class="subtitle" data-i18n="subtitle">员工档案、任职信息与资质到期统一管理</p>
				</div>
				<button class="button primary" id="create-button" type="button"><span aria-hidden="true">＋</span><span data-i18n="newEmployee">新建员工</span></button>
			</header>
			<nav class="module-tabs" aria-label="医药 OA 主数据"><button class="active" type="button" data-module="employee">员工</button><button type="button" data-module="customer">客户</button><button type="button" data-module="supplier">供应商</button></nav>

			<section class="scope-bar" aria-label="业务范围">
				<label><span data-i18n="tenant">租户</span><input id="tenant-input" autocomplete="off" placeholder="tenant-a" /></label>
				<label><span data-i18n="organization">组织</span><input id="organization-input" autocomplete="off" placeholder="org-a" /></label>
				<button class="button" id="scope-button" type="button" data-i18n="applyScope">应用范围</button>
			</section>

			<section class="metrics" aria-label="员工概览">
				<article><span data-i18n="totalEmployees">员工总数</span><strong id="metric-total">0</strong></article>
				<article><span data-i18n="activeEmployees">在职员工</span><strong id="metric-active">0</strong></article>
				<article><span data-i18n="departedEmployees">已离职</span><strong id="metric-left">0</strong></article>
				<article class="warning-metric"><span data-i18n="expiringQualifications">资质提醒</span><strong id="metric-reminders">0</strong></article>
			</section>

			<section class="content-section">
				<div class="toolbar">
					<label class="search-field"><span class="sr-only" data-i18n="search">搜索</span><span aria-hidden="true">⌕</span><input id="keyword-input" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="搜索姓名、工号、部门或邮箱" /></label>
					<label class="select-field"><span class="sr-only" data-i18n="employmentStatus">任职状态</span><select id="status-filter"><option value="" data-i18n="allStatuses">全部状态</option><option value="active" data-i18n="active">在职</option><option value="on_leave" data-i18n="onLeave">休假</option><option value="left" data-i18n="left">已离职</option></select></label>
					<button class="icon-button" id="refresh-button" type="button" title="刷新" aria-label="刷新">↻</button>
			</div>

				<div class="state-panel loading-state" aria-live="polite"><span class="spinner" aria-hidden="true"></span><p data-i18n="loading">正在加载员工档案</p></div>
				<div class="state-panel error-state" role="alert"><strong data-i18n="loadFailed">员工档案加载失败</strong><p id="error-message"></p><button class="button" id="retry-button" type="button" data-i18n="retry">重新加载</button></div>
				<div class="state-panel denied-state" role="alert"><strong data-i18n="permissionRequired">需要员工档案访问权限</strong><p data-i18n="contactAdmin">请联系管理员配置医药 OA 员工权限。</p></div>
				<div class="state-panel empty-state"><span class="empty-icon" aria-hidden="true">◇</span><strong data-i18n="noEmployees">暂无员工档案</strong><p data-i18n="emptyHint">创建首位员工，开始维护组织任职与资质信息。</p><button class="button primary" id="empty-create-button" type="button" data-i18n="newEmployee">新建员工</button></div>

				<div class="data-state">
					<div class="table-wrap">
						<table>
							<thead><tr><th data-i18n="employee">员工</th><th data-i18n="assignment">任职信息</th><th data-i18n="contact">联系方式</th><th data-i18n="qualifications">资质</th><th data-i18n="employmentStatus">任职状态</th><th class="actions-column" data-i18n="actions">操作</th></tr></thead>
							<tbody id="employee-table"></tbody>
						</table>
					</div>
					<div class="mobile-list" id="employee-cards"></div>
					<footer class="list-footer"><span id="result-count">共 0 条</span></footer>
				</div>
			</section>
		</main>

		<dialog class="dialog" id="employee-dialog">
			<form id="employee-form" method="dialog">
				<header><div><p class="eyebrow" data-i18n="employeeRecord">员工档案</p><h2 id="employee-dialog-title">新建员工</h2></div><button class="close-button" type="button" data-close="employee-dialog" aria-label="关闭">×</button></header>
				<div class="form-grid">
					<label><span data-i18n="employeeCode">员工工号</span><input name="code" maxlength="64" required /></label>
					<label><span data-i18n="employeeName">姓名</span><input name="name" maxlength="200" required /></label>
					<label><span data-i18n="department">部门</span><input name="departmentId" maxlength="128" required /></label>
					<label><span data-i18n="position">职位</span><input name="positionId" maxlength="128" required /></label>
					<label><span data-i18n="phone">手机号</span><input name="phone" maxlength="64" inputmode="tel" /></label>
					<label><span data-i18n="email">邮箱</span><input name="email" maxlength="250" type="email" /></label>
					<label><span data-i18n="hireDate">入职日期</span><input name="hireDate" type="date" /></label>
				</div>
				<fieldset><legend data-i18n="qualification">执业资质</legend><div class="form-grid"><label><span data-i18n="qualificationName">资质名称</span><input name="certificateName" maxlength="120" /></label><label><span data-i18n="qualificationNumber">证书编号</span><input name="certificateNumber" maxlength="120" /></label><label><span data-i18n="expiryDate">有效期至</span><input name="certificateExpiry" type="date" /></label></div></fieldset>
				<p class="form-error" id="employee-form-error" role="alert"></p>
				<footer><button class="button" type="button" data-close="employee-dialog" data-i18n="cancel">取消</button><button class="button primary" id="employee-save-button" type="submit" data-i18n="save">保存</button></footer>
			</form>
		</dialog>

		<dialog class="dialog compact-dialog" id="attachment-dialog">
			<form id="attachment-form" method="dialog"><header><div><p class="eyebrow" data-i18n="employeeAttachment">员工附件</p><h2 id="attachment-title">上传附件</h2></div><button class="close-button" type="button" data-close="attachment-dialog" aria-label="关闭">×</button></header><label class="file-field"><span data-i18n="selectFile">选择文件</span><input name="file" type="file" required /></label><p class="form-error" id="attachment-form-error" role="alert"></p><footer><button class="button" type="button" data-close="attachment-dialog" data-i18n="cancel">取消</button><button class="button primary" id="attachment-save-button" type="submit" data-i18n="upload">上传</button></footer></form>
		</dialog>

		<dialog class="dialog compact-dialog" id="leave-dialog">
			<form id="leave-form" method="dialog"><header><div><p class="eyebrow" data-i18n="employmentChange">任职变更</p><h2 id="leave-title">办理离职</h2></div><button class="close-button" type="button" data-close="leave-dialog" aria-label="关闭">×</button></header><label><span data-i18n="leaveReason">离职原因</span><textarea name="reason" maxlength="500" rows="4" required></textarea></label><p class="form-error" id="leave-form-error" role="alert"></p><footer><button class="button" type="button" data-close="leave-dialog" data-i18n="cancel">取消</button><button class="button danger" id="leave-save-button" type="submit" data-i18n="confirmLeave">确认离职</button></footer></form>
		</dialog>

		<dialog class="dialog" id="party-dialog">
			<form id="party-form" method="dialog"><header><div><p class="eyebrow" id="party-eyebrow">往来单位</p><h2 id="party-dialog-title">新建客户</h2></div><button class="close-button" type="button" data-close="party-dialog" aria-label="关闭">×</button></header>
				<div class="form-grid"><label><span>业务编码</span><input name="code" maxlength="64" required /></label><label><span>单位名称</span><input name="name" maxlength="255" required /></label><label><span>统一社会信用代码</span><input name="creditCode" minlength="8" maxlength="32" required /></label><label><span>所在地区</span><input name="region" maxlength="128" required /></label><label><span>合作评级</span><select name="rating"><option value="5">五星</option><option value="4">四星</option><option value="3">三星</option><option value="2">二星</option><option value="1">一星</option></select></label></div>
				<fieldset><legend>主联系人</legend><div class="form-grid"><label><span>姓名</span><input name="contactName" maxlength="120" required /></label><label><span>职务</span><input name="contactTitle" maxlength="120" /></label><label><span>手机号</span><input name="contactPhone" maxlength="64" /></label><label><span>邮箱</span><input name="contactEmail" type="email" maxlength="250" /></label></div></fieldset>
				<fieldset><legend>默认地址</legend><div class="form-grid"><label><span>地址标签</span><input name="addressLabel" value="总部" maxlength="64" required /></label><label><span>省份</span><input name="province" maxlength="64" /></label><label><span>城市</span><input name="city" maxlength="64" /></label><label><span>区县</span><input name="district" maxlength="64" /></label><label class="wide-field"><span>详细地址</span><input name="addressDetail" maxlength="300" required /></label></div></fieldset>
				<fieldset><legend>结算条款</legend><div class="form-grid"><label><span>币种</span><input name="currency" value="CNY" minlength="3" maxlength="3" required /></label><label><span>账期（天）</span><input name="paymentDays" type="number" min="0" max="365" value="30" required /></label><label><span>授信额度（元）</span><input name="creditLimit" type="number" min="0" value="0" required /></label></div></fieldset>
				<p class="form-error" id="party-form-error" role="alert"></p><footer><button class="button" type="button" data-close="party-dialog">取消</button><button class="button primary" id="party-save-button" type="submit">保存</button></footer></form>
		</dialog>

		<dialog class="dialog compact-dialog" id="party-status-dialog"><form id="party-status-form" method="dialog"><header><div><p class="eyebrow">状态变更</p><h2 id="party-status-title">停用客户</h2></div><button class="close-button" type="button" data-close="party-status-dialog" aria-label="关闭">×</button></header><label id="party-status-reason-field"><span>停用原因</span><textarea name="reason" maxlength="500" rows="4"></textarea></label><p class="form-error" id="party-status-error" role="alert"></p><footer><button class="button" type="button" data-close="party-status-dialog">取消</button><button class="button danger" id="party-status-save-button" type="submit">确认停用</button></footer></form></dialog>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>
		<script src="./app.js"></script>
	</body>
</html>
