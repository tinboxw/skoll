api:
  routes:
    - method: GET
      path: /v1/plugins/pharma_oa/api/meta
      summary: Read the independent Pharma OA plugin boundary
      permission: pharma_oa.foundation.read
      audit_action: pharma_oa.foundation.read
    - method: GET
      path: /v1/plugins/pharma_oa/api/oa-requests
      summary: List general OA requests
      permission: pharma_oa.oa_request.read
      audit_action: pharma_oa.oa_request.read_list
    - method: GET
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}
      summary: Read a general OA request and its workflow
      permission: pharma_oa.oa_request.read
      audit_action: pharma_oa.oa_request.read
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests
      summary: Create a general OA request draft
      permission: pharma_oa.oa_request.create
      audit_action: pharma_oa.oa_request.create
    - method: PUT
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}
      summary: Update a general OA request draft
      permission: pharma_oa.oa_request.update
      audit_action: pharma_oa.oa_request.update
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}/submit
      summary: Submit a general OA request to the host workflow service
      permission: pharma_oa.oa_request.submit
      audit_action: pharma_oa.oa_request.submit
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}/approve
      summary: Approve a general OA request task
      permission: pharma_oa.oa_request.approve
      audit_action: pharma_oa.oa_request.approve
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}/reject
      summary: Reject a general OA request task
      permission: pharma_oa.oa_request.reject
      audit_action: pharma_oa.oa_request.reject
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}/withdraw
      summary: Withdraw a general OA request
      permission: pharma_oa.oa_request.withdraw
      audit_action: pharma_oa.oa_request.withdraw
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}/cancel
      summary: Cancel a general OA request
      permission: pharma_oa.oa_request.cancel
      audit_action: pharma_oa.oa_request.cancel
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}/delegate
      summary: Delegate a general OA approval task
      permission: pharma_oa.oa_request.delegate
      audit_action: pharma_oa.oa_request.delegate
    - method: POST
      path: /v1/plugins/pharma_oa/api/oa-requests/{id}/attachments
      summary: Attach a private file to a general OA request
      permission: pharma_oa.oa_request.attach
      audit_action: pharma_oa.oa_request.attach
    - method: POST
