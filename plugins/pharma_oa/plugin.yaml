id: pharma_oa
name: Pharma OA
name_zh_cn: 医药 OA
name_en_us: Pharma OA
version: 0.3.0
api_version: v1
migration_version: 0.3.0
description: Pharma OA industry plugin skeleton for master data, workflow, inventory, and compliance modules.
ui_mode: monolith
level: app
app_id: pharma_oa
mount_policy: mixed
ui_nav_position: sidebar
ui_open_mode: integrated
ui_tab_mode: fixed
frontend_entry: /skoll/plugins/pharma-oa
service_base_url: http://127.0.0.1:18093
service_health_url: http://127.0.0.1:18093/health
ui_menu:
  key: plugin.pharma_oa
  label: Pharma OA
  label_zh_cn: 医药 OA
  label_en_us: Pharma OA
  path: /skoll/plugins/pharma-oa
  component: PluginRuntime
  icon: plugins
  order: 210
  required_permissions:
    - pharma_oa.menu.read
config_schema:
  title: Pharma OA Config
  title_zh_cn: 医药 OA 配置
  title_en_us: Pharma OA Config
  description: Skeleton configuration for pharma OA demo data and lifecycle smoke checks.
  fields:
    - key: pharma_oa.seed.enabled
      label: Enable demo seed entry
      label_zh_cn: 启用演示数据入口
      label_en_us: Enable demo seed entry
      type: boolean
      default: true
    - key: pharma_oa.seed.scope
      label: Demo seed scope
      label_zh_cn: 演示数据范围
      label_en_us: Demo seed scope
      type: string
      required: true
      default: minimal
      min_length: 3
      max_length: 32
    - key: pharma_oa.alert_days
      label: Qualification alert days
      label_zh_cn: 资质预警天数
      label_en_us: Qualification alert days
      type: number
      default: 30
      min: 1
      max: 365
i18n_locales:
  - zh-CN
  - en-US
permissions:
  - key: pharma_oa.foundation.read
    type: api
    module: pharma_oa
    name: Read Pharma OA plugin foundation contract
    risk: low
  - key: pharma_oa.menu.read
    type: menu
    module: pharma_oa
    name: View Pharma OA menu
    risk: low
    metadata.description: Allows the Pharma OA sidebar group to be displayed.
  - key: pharma_oa.plugin.manage
    type: plugin
    module: pharma_oa
    name: Manage Pharma OA plugin
    risk: high
    metadata.description: Allows plugin-level setup and demo seed operations.
  - key: pharma_oa.seed.apply
    type: button
    module: pharma_oa
    name: Apply Pharma OA demo seed
    risk: medium
    metadata.description: Initializes the complete Pharma OA demonstration scenario through the host seed service.
  - key: pharma_oa.seed.read
    type: api
    module: pharma_oa
    name: Read Pharma OA demo seed status
    risk: low
