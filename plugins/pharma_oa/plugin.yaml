data:
  namespace: pharma_oa
  migration_version: 0.3.0
  migration_directory: migrations
  uninstall_policy: drop
  rollback_policy: automatic
  tables:
    - name: pharma_oa_module_registry
      description: Tenant-scoped registry for the medical OA domain modules delivered by this plugin family.
      primary_key: id
      columns: id, tenant_id, organization_id, owner_id, module_key, status, contract_version, created_at, updated_at
      indexes: unique uq_pharma_oa_modules_tenant_key(tenant_id,module_key); idx_pharma_oa_modules_scope(tenant_id,organization_id,status)
    - name: pharma_oa_document_type_registry
      description: Tenant-scoped binding between medical business documents, modules, and host workflows.
      primary_key: id
      columns: id, tenant_id, organization_id, owner_id, document_type, module_key, workflow_key, status, created_at, updated_at
      indexes: unique uq_pharma_oa_documents_tenant_type(tenant_id,document_type); idx_pharma_oa_documents_scope(tenant_id,organization_id,status)
    - name: pharma_oa_employees
      description: Trusted-scope employee profiles, organization assignments, employment state, certificates, and owned attachments.
      primary_key: id
      columns: id, tenant_id, organization_id, owner_id, code, name, department_id, position_id, employment_status, phone, email, hire_date, left_at, leave_reason, attachments, certificates, version, created_at, updated_at
      indexes: unique uq_pharma_oa_employees_tenant_code(tenant_id,code); idx_pharma_oa_employees_scope(tenant_id,organization_id,employment_status); idx_pharma_oa_employees_name(tenant_id,name)

events:
  subscriptions:
    - name: approval-completed
      handler: onApprovalCompleted
      retry_policy: standard
    - name: qualification-expiring
      handler: onQualificationExpiring
      retry_policy: standard
    - name: inventory-changed
      handler: onInventoryChanged
      retry_policy: standard
    - name: quality-lot-released
      handler: onQualityLotReleased
      retry_policy: standard
    - name: quality-recall-started
      handler: onQualityRecallStarted
      retry_policy: standard
