api:
  routes:
    - method: GET
      path: /v1/plugins/pharma_oa/api/meta
      summary: Read the independent Pharma OA plugin boundary
      permission: pharma_oa.foundation.read
      audit_action: pharma_oa.foundation.read
    - method: GET
      path: /v1/plugins/pharma_oa/api/employees
      summary: List Pharma OA employees
      permission: pharma_oa.employee.read
      audit_action: pharma_oa.employee.read
    - method: POST
      path: /v1/plugins/pharma_oa/api/employees
      summary: Create Pharma OA employee
      permission: pharma_oa.employee.create
      audit_action: pharma_oa.employee.create
    - method: PUT
      path: /v1/plugins/pharma_oa/api/employees/{id}
