version: 1
tables:
  - name: records
    mutation_policy: mutable
    primary_key: [id]
    fields:
      - name: id
        type: string
        filterable: true
        sortable: true
      - name: name
        type: string
        mutable: true
        filterable: true
        sortable: true
    indexes:
      - fields: [name]
