openapi: 3.0.3
info:
  title: Skoll API
  version: 1.0.0
  description: OpenAPI document for Skoll core HTTP endpoints.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/users:
    get:
      summary: List users
      responses:
        '200':
          description: OK
    post:
      summary: Create user
      responses:
        '201':
          description: Created
  /v1/users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    put:
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/roles:
    get:
      summary: List roles
      responses:
        '200':
          description: OK
    post:
      summary: Create role
      responses:
        '201':
          description: Created
  /v1/rbac/check:
    post:
      summary: Check authorization
      responses:
        '200':
          description: OK
  /v1/audit:
    get:
      summary: List audit records
      responses:
        '200':
          description: OK
    delete:
      summary: Clear audit records by time range
      responses:
        '200':
          description: OK
  /v1/audit/{id}:
    get:
      summary: Get audit record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/audit/export:
    get:
      summary: Export audit records as CSV
      responses:
        '200':
          description: OK
  /v1/audit/actors/{actorId}:
    get:
      summary: List audit records by actor
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/plugins:
    get:
      summary: List plugins
      responses:
        '200':
          description: OK
  /v1/plugins/{id}:
    get:
      summary: Get plugin detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
  /v1/plugins/{id}/config:
    get:
      summary: Get plugin config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      summary: Update plugin config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/system/settings:
    get:
      summary: List system settings
      responses:
        '200':
          description: OK
  /v1/system/settings/{key}:
    get:
      summary: Get system setting by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
    put:
      summary: Upsert system setting by key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/system/settings/reset:
    post:
      summary: Reset system settings
      responses:
        '200':
          description: OK
components: {}
